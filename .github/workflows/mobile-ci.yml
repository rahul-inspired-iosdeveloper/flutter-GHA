# Generated by zero_touch v2.0 - do not edit by hand.
# Regenerating with zero_touch will overwrite any manual changes to this file.
name: Mobile CI

on:
  push:
    tags:
      - 'beta_release_*'
      - 'staging_release_*'
      - 'prod_release_*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PROJECT_TYPE: 'flutter'
  PROJECT_NAME: 'flutter_gha'
  MIN_COVERAGE: '80'
  ENFORCE_COVERAGE: 'true'
  LINT_LEVEL: 'strict'
  LINT_ENFORCE: 'true'
  LINT_ENFORCE_FORMAT: 'true'
  LINT_EXCLUDE: ''
  MAX_FUNCTION_LINES: '40'
  MAX_FILE_LINES: '400'
  MAX_PARAMETERS: '5'
  MAX_COMPLEXITY: '10'
  MAX_NESTING_DEPTH: '3'
  MAX_LINE_LENGTH: '120'
  MAX_TYPE_BODY_LINES: '250'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@a2bbe5b1b236842c1cb7dd11e8e3b51e0a616acc # v1.202.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Install toolchain
        run: bash ci/setup.sh
      - name: Lint
        run: bundle exec fastlane lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@a2bbe5b1b236842c1cb7dd11e8e3b51e0a616acc # v1.202.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Install toolchain
        run: bash ci/setup.sh
      - name: Test
        run: bundle exec fastlane test
      - name: Coverage gate
        run: |
          bash ci/coverage.sh
          echo "### Coverage score: $(cat ci-artifacts/coverage-score.txt)%" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage/lcov.info
            ci-artifacts/coverage-score.txt
          if-no-files-found: ignore
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            fastlane/test_output/**
            build/reports/**
          if-no-files-found: ignore

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@a2bbe5b1b236842c1cb7dd11e8e3b51e0a616acc # v1.202.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Install toolchain
        run: bash ci/setup.sh
      - name: Build
        run: bundle exec fastlane build
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-outputs-${{ matrix.platform }}
          path: |
            build/**
          if-no-files-found: ignore


  release_ios:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/beta_release_') || startsWith(github.ref, 'refs/tags/staging_release_') || startsWith(github.ref, 'refs/tags/prod_release_'))
    runs-on: macos-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@a2bbe5b1b236842c1cb7dd11e8e3b51e0a616acc # v1.202.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Install toolchain
        run: bash ci/setup.sh
      - name: Write Firebase Service Account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json
            echo "FIREBASE_SERVICE_ACCOUNT_JSON=$PWD/firebase-service-account.json" >> $GITHUB_ENV
          fi
      - name: Release iOS
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane release_ios
      - name: Notify Teams (iOS distributed)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: bash ci/notify_teams.sh success "Release iOS" "iOS build distributed for $PROJECT_NAME on $GITHUB_REF_NAME"
      - name: Shred Firebase Service Account
        if: always()
        run: |
          if [ -f firebase-service-account.json ]; then
            shred -u firebase-service-account.json 2>/dev/null || rm -f firebase-service-account.json
          fi

  release_android:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/beta_release_') || startsWith(github.ref, 'refs/tags/staging_release_') || startsWith(github.ref, 'refs/tags/prod_release_'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@a2bbe5b1b236842c1cb7dd11e8e3b51e0a616acc # v1.202.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Install toolchain
        run: bash ci/setup.sh
      - name: Write Firebase Service Account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json
            echo "FIREBASE_SERVICE_ACCOUNT_JSON=$PWD/firebase-service-account.json" >> $GITHUB_ENV
          fi
      - name: Release Android
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA }}
        run: bundle exec fastlane release_android
      - name: Notify Teams (Android distributed)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: bash ci/notify_teams.sh success "Release Android" "Android build distributed for $PROJECT_NAME on $GITHUB_REF_NAME"
      - name: Shred Firebase Service Account
        if: always()
        run: |
          if [ -f firebase-service-account.json ]; then
            shred -u firebase-service-account.json 2>/dev/null || rm -f firebase-service-account.json
          fi

  notify_failure:
    needs: [lint, test, build, release_ios, release_android]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Notify Teams (failure)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: | 
          bash ci/notify_teams.sh failure "Pipeline" "Mobile CI failed for $PROJECT_NAME on $GITHUB_REF_NAME (run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"

  notify_pr_build_success:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Notify Teams (PR build success)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: bash ci/notify_teams.sh success "Build" "PR build succeeded for $PROJECT_NAME on $GITHUB_HEAD_REF"
