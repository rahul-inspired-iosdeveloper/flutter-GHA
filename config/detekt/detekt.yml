  MagicNumber:
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
  ReturnCount:
    max: 4
  ForbiddenComment:
    values:
      - "TODO"
      - "FIXME"
      - "HACK"
    allowedPatterns:
      - "tasks/"

potential-bugs:

exceptions:

empty-blocks:
  EmptyFunctionBlock:
    active: true
  EmptyCatchBlock:
    active: true

comments:
  CommentOverPrivateFunction:
    active: true
  UndocumentedPublicClass:
    active: false
    searchInNestedClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
  UndocumentedPublicFunction:
    active: false

formatting:
  active: true
  autoCorrect: true