# Generated by zero_touch v1.1 — do not edit by hand.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true

complexity:
  LongMethod:
    threshold: 40
  LongParameterList:
    functionThreshold: 5
    constructorThreshold: 5
    ignoreDefaultParameters: false
  CyclomaticComplexMethod:
    threshold: 10
  NestedBlockDepth:
    threshold: 3
  TooManyFunctions:
    thresholdInFile: 400
    thresholdInClasses: 250
  LargeClass:
    threshold: 250
naming:

style:
