# Generated by zero_touch v1.1 — do not edit by hand.
included:
    - ios/Runner

excluded:
  - Pods
  - .build
  - DerivedData
  - "**/*.generated.swift"

opt_in_rules:
  - type_name
  - identifier_name
  - file_name
  - discouraged_direct_init
  - unused_import
  - unused_declaration
  - unused_setter_value
  - unreachable_code
  - no_magic_numbers
  - force_cast
  - force_try
  - force_unwrap
  - implicitly_unwrapped_optional
  - empty_count
  - empty_string
  - untyped_error_in_catch
  - todo
  - comment_spacing
  - orphaned_doc_comment
  - sorted_imports
  - type_contents_order
  - unneeded_break_in_switch
  - redundant_optional_initialization
  - redundant_type_annotation
  - redundant_void_return
  - redundant_string_enum_value
  - let_var_whitespace
  - implicit_getter_setter
  - first_where
  - contains_over_first_not_nil
  - last_where
  - trailing_whitespace
  - vertical_whitespace
  - trailing_comma
  - colon
  - trailing_newline
  - vertical_whitespace_closing_braces


function_body_length:
  warning: 40
type_body_length:
  warning: 250
file_length:
  warning: 400
line_length:
  warning: 120
cyclomatic_complexity:
  warning: 10
nesting:
  type_level: 3
  function_level: 3
function_parameter_count:
  warning: 5

custom_rules:
  print:
    name: "No print statements"
    regex: "(^|\s)print\("
    message: "Use a logger instead of print"
    severity: error